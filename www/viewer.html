<!DOCTYPE html>
<html>

<head>
    <title>Autodesk Forge: 3D Viewer App Sample</title>

    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
    <!-- Third Party package -->
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <!-- Autodesk Forge Viewer files (IMPORTANT) -->
    <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css" type="text/css">
    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
    <style>
        /** Just simple CSS styling to make this page a little nicer **/
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <!-- The Viewer will be instantiated here -->
    <div id="MyViewerDiv"></div>
    <!-- Custom script -->
    <script>
        var viewer;
        var options = {
            env: 'AutodeskProduction',
            api: 'derivativeV2', // Change to 'derivativeV2_EU' if your app is registered in EMEA region
            getAccessToken: getForgeToken
        };
        var documentId = 'urn:' + getUrlParameter('urn');
        var urn = getUrlParameter('urn');
        var checkCount = 0;
        var maxChecks = 60; // Maximum 5 minutes (60 * 5 seconds)

        // Run this when the page is loaded
        Autodesk.Viewing.Initializer(options, function onInitialized(){
            // Find the element where the 3d viewer will live.    
            var htmlElement = document.getElementById('MyViewerDiv');
            if (htmlElement) {
                // Create and start the viewer in that element    
                viewer = new Autodesk.Viewing.GuiViewer3D(htmlElement);
                viewer.start();
                
                // Check if the model derivative job is complete before loading
                checkModelDerivativeStatus();
            }
        });
        
        // Check model derivative job status
        function checkModelDerivativeStatus() {
            if (!urn) {
                jQuery('#MyViewerDiv').html('<p>Error: No URN provided</p>');
                return;
            }
            
            checkCount++;
            if (checkCount > maxChecks) {
                jQuery('#MyViewerDiv').html('<p>Model conversion is taking longer than expected. Please try refreshing the page or contact support.</p>');
                return;
            }
            
            jQuery('#MyViewerDiv').html('<p>Checking conversion status... (' + checkCount + '/' + maxChecks + ')</p>');
            
            jQuery.ajax({
                url: '/api/forge/modelderivative/status/' + encodeURIComponent(urn),
                success: function (manifest) {
                    console.log('Manifest received:', manifest);
                    
                    // Check if the manifest has the required derivatives
                    if (manifest && manifest.derivatives && manifest.derivatives.length > 0) {
                        var hasViewable = false;
                        for (var i = 0; i < manifest.derivatives.length; i++) {
                            var derivative = manifest.derivatives[i];
                            if (derivative.outputType === 'svf' && derivative.children) {
                                hasViewable = true;
                                break;
                            }
                        }
                        
                        if (hasViewable) {
                            // Model is ready, load it
                            jQuery('#MyViewerDiv').html('<p>Loading model...</p>');
                            Autodesk.Viewing.Document.load(documentId, onDocumentLoadSuccess, onDocumentLoadFailure);
                        } else {
                            // Still processing
                            jQuery('#MyViewerDiv').html('<p>Model is still being processed. Please wait...</p>');
                            setTimeout(checkModelDerivativeStatus, 5000); // Check again in 5 seconds
                        }
                    } else {
                        // Still processing
                        jQuery('#MyViewerDiv').html('<p>Model is still being processed. Please wait...</p>');
                        setTimeout(checkModelDerivativeStatus, 5000); // Check again in 5 seconds
                    }
                },
                error: function (xhr, status, error) {
                    console.error('Error checking manifest:', error);
                    if (xhr.status === 404) {
                        // Model derivative job not found or still processing
                        jQuery('#MyViewerDiv').html('<p>Model is still being processed. Please wait...</p>');
                        setTimeout(checkModelDerivativeStatus, 5000); // Check again in 5 seconds
                    } else {
                        jQuery('#MyViewerDiv').html('<p>Error checking model status: ' + error + '</p>');
                    }
                }
            });
        }

        /**
        * Autodesk.Viewing.Document.load() success callback.
        * Proceeds with model initialization.
        */
        function onDocumentLoadSuccess(doc) {
            // Load the default viewable geometry into the viewer.
            // Using the doc, we have access to the root BubbleNode,
            // which references the root node of a graph that wraps each object from the Manifest JSON.
            var viewable = doc.getRoot().getDefaultGeometry();
            if (viewable) {
                viewer.loadDocumentNode(doc, viewable).then(function(result) {
                    console.log('Viewable Loaded!');
                }).catch(function(err) {
                    console.log('Viewable failed to load.');
                    console.log(err);
                }
              )
            }
        }

        /**
        * Autodesk.Viewing.Document.load() failure callback.
        */
        function onDocumentLoadFailure(viewerErrorCode) {
            console.error('onDocumentLoadFailure() - errorCode: ' + viewerErrorCode);
            
            // Provide more specific error messages based on error codes
            var errorMessage = 'Failed to load model. ';
            switch(viewerErrorCode) {
                case 1:
                    errorMessage += 'Invalid URN or model not found.';
                    break;
                case 2:
                    errorMessage += 'Model derivative job failed or not complete.';
                    break;
                case 3:
                    errorMessage += 'Model derivative job is still in progress.';
                    break;
                case 4:
                    errorMessage += 'Authentication failed.';
                    break;
                default:
                    errorMessage += 'Error code: ' + viewerErrorCode;
            }
            
            jQuery('#MyViewerDiv').html('<p>' + errorMessage + '</p><p>Please try refreshing the page in a few moments.</p>');
        }

        // Get Query string from URL,
        // we will use this to get the value of 'urn' from URL
        function getUrlParameter(name) {
            name = name.replace(/[[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // Get public access token for read only,
        // using ajax to access route /api/forge/oauth/public in the background
        function getForgeToken(callback) {
            jQuery.ajax({
                url: '/api/forge/oauth/public',
                success: function (res) {
                    callback(res.access_token, res.expires_in);
                }
            });
        }
        
  </script>
</body>

</html>
